# Builds the installable Skill zip and attaches it to a GitHub Release.
#
# Cut a release:   git tag v0.3 && git push origin v0.3
# The zip is then always available at a stable address:
#   https://github.com/nosimajtechnology/chihuahua-community-engine/releases/latest/download/chihuahua-community-engine.zip
#
# Every push and pull request runs the validation half only, so a broken
# link or a missing front-matter field is caught before it ships.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and build the Skill zip
        run: python3 scripts/build_release.py

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/chihuahua-community-engine.zip dist/SHA256SUMS \
            --title "Chihuahua Community Engine ${GITHUB_REF_NAME}" \
            --generate-notes
